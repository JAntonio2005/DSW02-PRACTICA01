name: CI 01

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Probar backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Probar frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          CYPRESS_VERSION=$(node -p "require('./package-lock.json').packages['node_modules/cypress'].version")
          CYPRESS_INSTALL_BINARY="$CYPRESS_VERSION" ./node_modules/.bin/cypress install
          npm run test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Probar frontend E2E (Cypress)
        working-directory: frontend
        run: npm run e2e
