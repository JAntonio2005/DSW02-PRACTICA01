name: CI 01

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Probar backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Probar frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx cypress install
          npm run test -- --watch=false --browsers=ChromeHeadless --no-progress

      - name: Probar frontend E2E (Cypress)
        working-directory: frontend
        run: npm run e2e
