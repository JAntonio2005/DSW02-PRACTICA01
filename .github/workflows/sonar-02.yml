name: 02-SonarCloud

on:
  workflow_run:
    workflows:
      - 01-CI
    types:
      - completed
  workflow_dispatch:

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Ejecutar tests frontend con cobertura
        working-directory: frontend
        env:
          CI: true
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox --no-progress --code-coverage --karma-config=karma.conf.js

      - name: Compilar backend (sin tests)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile

      - name: Ejecutar SonarCloud Scanner
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java,frontend/src
            -Dsonar.exclusions=src/test/java/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts,cypress/**,frontend/cypress/**,cypress.config.js,frontend/karma.conf.js,**/*.cy.js,**/*.cy.ts
            -Dsonar.coverage.exclusions=src/test/java/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts,cypress/**,frontend/cypress/**,cypress.config.js,frontend/karma.conf.js,**/*.cy.js,**/*.cy.ts
            -Dsonar.cpd.exclusions=src/test/java/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts,cypress/**,frontend/cypress/**,cypress.config.js,frontend/karma.conf.js,**/*.cy.js,**/*.cy.ts
            -Dsonar.java.binaries=target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

      - name: Diagnosticar report-task de Sonar
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::No existe .scannerwork/report-task.txt. El scanner no generó metadata esperada."
            exit 1
          fi
          echo "report-task.txt exists"
          grep -E '^(projectKey|serverUrl|dashboardUrl|ceTaskUrl)=' .scannerwork/report-task.txt || true

      - name: Validar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
