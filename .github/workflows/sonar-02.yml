name: Sonar-02

on:
  workflow_run:
    workflows:
      - CI 01
    types:
      - completed
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sonarcloud:
    name: SonarCloud Scan
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Ejecutar tests frontend con cobertura
        working-directory: frontend
        env:
          CI: true
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox --no-progress --code-coverage --karma-config=karma.conf.js

      - name: Compilar backend (sin tests)
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests compile

      - name: Ejecutar SonarCloud Scanner
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

      - name: Validar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
