name: Sonar-02

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Ejecutar tests frontend con cobertura
        working-directory: frontend
        env:
          CI: true
        run: npm run test -- --watch=false --browsers=ChromeHeadlessNoSandbox --no-progress --code-coverage --karma-config=karma.conf.js

      - name: Compilar backend (sin tests)
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress -DskipTests compile

      - name: Ejecutar SonarCloud Scanner
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.java.binaries=target/classes
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/frontend/lcov.info

      - name: Validar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
