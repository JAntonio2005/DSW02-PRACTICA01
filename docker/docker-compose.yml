services:
  postgres:
    image: postgres:16
    container_name: empleados-postgres
    environment:
      POSTGRES_DB: empleadosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empleadosdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-internal

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: empleados-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/empleadosdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      APP_JWT_SECRET: 0123456789ABCDEF0123456789ABCDEF
      APP_JWT_EXPIRATION_MINUTES: 60
    expose:
      - "8080"
    networks:
      - app-internal

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: empleados-frontend
    depends_on:
      - app
    expose:
      - "4200"
    networks:
      - app-internal

  nginx:
    image: nginx:1.27-alpine
    container_name: empleados-nginx
    depends_on:
      - frontend
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-internal

networks:
  app-internal:
    name: empleados-app-internal
